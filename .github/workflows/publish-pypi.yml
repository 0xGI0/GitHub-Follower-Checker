name: PyPI

# Manuell auslösen (Actions → PyPI → Run workflow).
# Voraussetzung: Auf pypi.org unter "Publishing" einen Trusted Publisher
# für dieses Repo anlegen (Workflow: publish-pypi.yml, Environment: pypi) –
# dann braucht es kein API-Token im Repo.
on:
  workflow_dispatch:

# Least Privilege: id-token nur im Job, der es braucht
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Paket bauen
        run: |
          python -m pip install --upgrade pip build==1.5.0
          python -m build

      - name: Auf PyPI veröffentlichen (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
