name: Release

on:
  push:
    tags: ["v*"]

# id-token/attestations: für die Build-Provenance-Attestation (Sigstore)
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: GitHubFollowerChecker
            asset: GitHubFollowerChecker-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: windows-latest
            binary: GitHubFollowerChecker.exe
            asset: GitHubFollowerChecker-${{ github.ref_name }}-windows-x86_64.exe
          - os: macos-latest
            asset: GitHubFollowerChecker-${{ github.ref_name }}-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flet-cli pyinstaller

      - name: Binary bauen (Linux/Windows)
        if: runner.os != 'macOS'
        run: >
          flet pack GitHubFollowerCheckerGUI.py
          --name GitHubFollowerChecker
          --icon docs/icon.ico

      # macOS: flet pack erzeugt ein .app-Bundle; als ZIP anhängen (.ico wird
      # unter macOS nicht unterstützt, daher ohne --icon)
      - name: App bauen (macOS)
        if: runner.os == 'macOS'
        run: |
          flet pack GitHubFollowerCheckerGUI.py --name GitHubFollowerChecker
          ditto -c -k --keepParent dist/GitHubFollowerChecker.app "dist/${{ matrix.asset }}"

      # Linux: als tar.gz packen, damit das Executable-Bit erhalten bleibt
      # (Release-Assets speichern selbst keine Dateirechte)
      - name: Artefakt packen (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/${{ matrix.asset }}" -C dist "${{ matrix.binary }}"

      - name: Artefakt umbenennen (Windows)
        if: runner.os == 'Windows'
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      # GitHub bescheinigt, dass genau diese Datei aus diesem Repo/Commit
      # gebaut wurde – prüfbar mit: gh attestation verify <datei> --owner 0xGI0
      - name: Build-Provenance attestieren
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: An Release anhängen
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true

  # Hashes werden von den ECHTEN, veröffentlichten Release-Assets berechnet
  # (erst herunterladen, dann hashen) – nicht von den lokalen Build-Artefakten
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt erzeugen und an Release + Notes anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern 'GitHubFollowerChecker-*' --dir assets
          (cd assets && sha256sum GitHubFollowerChecker-*) > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
          # Notes: evtl. vorhandenen Checksums-Abschnitt ersetzen (idempotent)
          gh release view "$TAG" --repo "$REPO" --json body -q .body | tr -d '\r' | sed '/^## Checksums$/,$d' > notes.md
          printf '## Checksums\n\nSHA-256 (auch als Asset `SHA256SUMS.txt` angehängt / also attached as asset `SHA256SUMS.txt`):\n\n```\n%s\n```\n' "$(cat SHA256SUMS.txt)" >> notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
