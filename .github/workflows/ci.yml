name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least Privilege: CI liest nur den Code, mehr braucht kein Job
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # ruff gepinnt: 0.16.0 verschärft die Default-Regeln (74 neue
          # Findings in Bestandscode) – Upgrade + Fixes separat angehen
          pip install -r requirements.txt pytest ruff==0.15.22 mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Typen (mypy)
        run: mypy gfc_core.py gfc_controller.py GitHubFollowerCheckerGUI.py GitHubFollowerCheckerCLI.py

      - name: Syntax-Check
        run: python -m py_compile gfc_core.py gfc_controller.py GitHubFollowerCheckerGUI.py GitHubFollowerCheckerCLI.py

      - name: Tests (pytest)
        run: python -m pytest -q
