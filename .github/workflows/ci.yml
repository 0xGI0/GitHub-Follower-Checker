name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least Privilege: CI liest nur den Code, mehr braucht kein Job
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Alle Werkzeuge exakt gepinnt – Versionsdrift hat CI schon einmal
      # gebrochen (ruff 0.16.0); Updates bewusst per Commit
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 ruff==0.15.22 mypy==2.3.0 bandit==1.9.4 pip-audit==2.10.1

      - name: Lint (ruff)
        run: ruff check .

      - name: Typen (mypy)
        run: mypy gfc_core.py gfc_controller.py GitHubFollowerCheckerGUI.py GitHubFollowerCheckerCLI.py

      - name: Syntax-Check
        run: python -m py_compile gfc_core.py gfc_controller.py GitHubFollowerCheckerGUI.py GitHubFollowerCheckerCLI.py

      - name: Security-Lint (bandit)
        run: bandit -q -r gfc_core.py gfc_controller.py GitHubFollowerCheckerGUI.py GitHubFollowerCheckerCLI.py

      - name: CVE-Audit der Abhängigkeiten (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests (pytest)
        run: python -m pytest -q
