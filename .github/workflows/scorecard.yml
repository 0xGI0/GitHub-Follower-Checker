name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # wöchentlich montags

# Least Privilege: nur lesen; der Job erweitert gezielt
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF-Upload → Code-Scanning-Alerts
      id-token: write # publish_results (signierte Veröffentlichung via OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
